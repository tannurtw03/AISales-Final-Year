<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="favBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="favArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Neural Network Brain Arc (Transparent background) -->
  <path d="M 230 100 C 130 100, 80 170, 80 256 C 80 342, 130 412, 230 412" stroke="url(#favBlueGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M 140 180 C 190 220, 180 300, 140 340" stroke="url(#favBlueGrad)" stroke-width="16" stroke-dasharray="16 16" opacity="0.8"/>

  <circle cx="140" cy="180" r="20" fill="#2563EB"/>
  <circle cx="100" cy="256" r="20" fill="#4F46E5"/>
  <circle cx="140" cy="340" r="20" fill="#7C3AED"/>

  <!-- Right Brain Arc -->
  <path d="M 280 100 C 370 100, 420 170, 420 240" stroke="url(#favBlueGrad)" stroke-width="22" stroke-linecap="round" opacity="0.6"/>

  <!-- Upward AI Trend Growth Arrow Line -->
  <path d="M 90 380 L 200 270 L 280 320 L 420 130" stroke="url(#favArrowGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#favGlow)"/>
  
  <!-- Arrow Head -->
  <path d="M 350 130 H 420 V 200" stroke="url(#favArrowGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Glowing Nodes -->
  <circle cx="200" cy="270" r="18" fill="#38BDF8"/>
  <circle cx="280" cy="320" r="18" fill="#818CF8"/>
  <circle cx="420" cy="130" r="22" fill="#10B981" filter="url(#favGlow)"/>
</svg>
